<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLens — New Patient</title>
  <meta name="description" content="Enter patient details to create a new MedLens record.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <nav>
    <a class="nav-brand" href="/dashboard.html">MedLens</a>
    <a href="/dashboard.html">Patients</a>
    <a href="/index.html" class="active-nav">New Patient Intake</a>
  </nav>

  <main>
    <h1>Patient Intake Form</h1>
    <p class="page-sub">
      Document baseline patient clinical details. Every field you enter will be labelled
      <span class="provenance-badge prov-user">Clinician entered</span> throughout the record.
    </p>

    <!-- Error / success messages appear here -->
    <div id="alert-area"></div>

    <div class="doc-panel">
      <form id="intake-form" novalidate>

        <!-- Patient Name & MRN -->
        <div style="display:grid; grid-template-columns:2fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="name">Patient full name <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="e.g. Eleanor Vance" required>
          </div>
          <div class="form-group">
            <label for="mrn">MRN / Record #</label>
            <input type="text" id="mrn" name="mrn" placeholder="e.g. MRN-89421">
          </div>
        </div>

        <!-- Age & Sex side by side on wider screens -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="age">Age <span class="required">*</span></label>
            <input type="number" id="age" name="age" min="0" max="150" placeholder="e.g. 45" required>
          </div>
          <div class="form-group">
            <label for="sex">Biological sex <span class="required">*</span></label>
            <select id="sex" name="sex" required>
              <option value="">Select…</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other / Prefer not to say">Other / Prefer not to say</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="symptoms">Current symptoms</label>
          <textarea id="symptoms" name="symptoms"
            placeholder="e.g. fatigue, headaches for 2 weeks, occasional dizziness"></textarea>
        </div>

        <div class="form-group">
          <label for="existing_conditions">Existing conditions</label>
          <textarea id="existing_conditions" name="existing_conditions"
            placeholder="e.g. Type 2 diabetes, hypertension, asthma"></textarea>
        </div>

        <div class="form-group">
          <label for="allergies">Allergies</label>
          <textarea id="allergies" name="allergies"
            placeholder="e.g. Penicillin, sulfa drugs, pollen"></textarea>
        </div>

        <div class="form-group">
          <label for="current_medications">Current medications</label>
          <textarea id="current_medications" name="current_medications"
            placeholder="e.g. Metformin 500 mg twice daily, Lisinopril 10 mg once daily"></textarea>
        </div>

        <div class="form-group">
          <label for="notes">Additional clinical notes</label>
          <textarea id="notes" name="notes"
            placeholder="Additional observations or history"></textarea>
        </div>

        <button type="submit" class="btn" id="submit-btn">
          Save and Continue
        </button>

      </form>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/intake.js"></script>
</body>
</html>
