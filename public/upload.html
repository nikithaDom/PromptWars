<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLens — Upload Lab Report</title>
  <meta name="description" content="Upload a lab report image or PDF to extract test results.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <nav>
    <a class="nav-brand" href="/dashboard.html">⚕ MedLens</a>
    <a href="/dashboard.html">Patients</a>
    <a href="/index.html">+ New Intake</a>
    <!-- filled in by upload.js once we know the patient ID -->
    <span id="nav-patient-links"></span>
  </nav>

  <main>
    <h1>Upload Lab Report</h1>
    <p class="page-sub">
      Upload an image (JPG, PNG, WEBP) or PDF of a lab report.
      Results will be labelled <span class="badge badge-ai">AI extracted this</span>.
    </p>

    <!-- Patient summary line, filled by JS -->
    <div id="patient-summary" class="card" style="padding: 14px 20px;">
      <span class="text-muted">Loading patient…</span>
    </div>

    <div id="alert-area"></div>

    <div class="card">
      <form id="upload-form">

        <label>Lab Report File</label>

        <!-- Clicking anywhere in this zone opens the file picker -->
        <div class="upload-zone" id="upload-zone" role="button" tabindex="0"
             aria-label="Click or drag a file here to upload">
          <input type="file" id="report-file" name="report"
                 accept="image/jpeg,image/png,image/webp,image/gif,application/pdf">
          <span class="upload-icon">📄</span>
          <strong>Click to choose a file, or drag &amp; drop here</strong>
          <p>Accepts PDF, JPG, PNG, WEBP</p>
          <p id="file-name"></p>
        </div>

        <div class="mt-16">
          <button type="submit" class="btn" id="upload-btn">
            Extract Results
          </button>
        </div>

      </form>
    </div>

    <!-- List of reports already uploaded for this patient -->
    <div id="existing-reports"></div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/upload.js"></script>
</body>
</html>
